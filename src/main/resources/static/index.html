<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>urlshortener</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Premium Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 antialiased">

    <div class="w-full max-w-xl bg-white rounded-3xl shadow-xl shadow-slate-200/60 border border-slate-100 p-8 md:p-10">
        
        <!-- Header: Logo & Title -->
        <div class="flex flex-col items-center justify-center text-center mb-8">
            <!-- 2 Interlocking Rings Logo (SVG) -->
            <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mb-4 shadow-inner">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 17H7A5 5 0 0 1 7 7h2"></path>
                    <path d="M15 7h2a5 5 0 0 1 0 10h-2"></path>
                    <line x1="8" y1="12" x2="16" y2="12"></line>
                </svg>
            </div>
            <h1 class="text-3xl font-extrabold tracking-tight text-slate-800">
                url<span class="text-blue-600">shortener</span>
            </h1>
        </div>

        <!-- Input Section -->
        <form id="shortenerForm" class="space-y-5">
            <div>
                <input 
                    type="url" 
                    id="urlInput" 
                    required
                    placeholder="Paste your long URL here..." 
                    class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-base shadow-sm"
                />
            </div>
            <button 
                type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-4 px-6 rounded-2xl transition-all shadow-md shadow-blue-500/10 active:scale-[0.99]"
            >
                Shorten Link
            </button>
        </form>

        <!-- Result Section (Hidden until shortened successfully) -->
        <div id="resultSection" class="hidden mt-8 pt-8 border-t border-slate-100 space-y-5 animate-[fadeIn_0.3s_ease-out]">
            
            <!-- Acknowledgment Message with Green Tick -->
            <div class="flex items-center gap-3 bg-emerald-50 text-emerald-800 px-5 py-3.5 rounded-2xl border border-emerald-100/50">
                <span class="flex-shrink-0 w-6 h-6 rounded-full bg-emerald-500 text-white flex items-center justify-center shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                    </svg>
                </span>
                <span class="font-semibold text-sm md:text-base">short url created</span>
            </div>

            <!-- Original URL Field -->
            <div class="space-y-1.5">
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider">original url:</label>
                <input 
                    type="text" 
                    id="originalUrlTextbox" 
                    readonly 
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-500 text-sm focus:outline-none cursor-default"
                />
            </div>

            <!-- Short URL Field -->
            <div class="space-y-1.5">
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider">short url:</label>
                <div class="relative flex items-center">
                    <input 
                        type="text" 
                        id="shortUrlTextbox" 
                        readonly 
                        class="w-full pl-4 pr-24 py-3.5 bg-blue-50/30 border border-blue-200 rounded-xl text-blue-700 font-medium focus:outline-none cursor-default"
                    />
                    <button 
                        id="copyButton"
                        type="button"
                        class="absolute right-2 bg-white border border-slate-200 hover:border-slate-300 text-slate-600 font-medium text-xs px-3.5 py-2 rounded-lg transition-all active:scale-95 shadow-sm"
                    >
                        Copy
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- Interface Controller Logic -->
    <script>
        const form = document.getElementById('shortenerForm');
        const resultSection = document.getElementById('resultSection');
        const originalUrlTextbox = document.getElementById('originalUrlTextbox');
        const shortUrlTextbox = document.getElementById('shortUrlTextbox');
        const copyButton = document.getElementById('copyButton');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const rawUrl = document.getElementById('urlInput').value;

            // Populate textboxes
            originalUrlTextbox.value = rawUrl;
            
            // Generate dummy short hash string for demo
            const pseudoHash = Math.random().toString(36).substring(2, 8);
            shortUrlTextbox.value = window.location.origin + '/' + pseudoHash;

            // Unhide result structure
            resultSection.classList.remove('hidden');
        });

        // Quick Copy Utility
        copyButton.addEventListener('click', function() {
            navigator.clipboard.writeText(shortUrlTextbox.value).then(() => {
                copyButton.textContent = 'Copied!';
                copyButton.classList.replace('text-slate-600', 'text-emerald-600');
                
                setTimeout(() => {
                    copyButton.textContent = 'Copy';
                    copyButton.classList.replace('text-emerald-600', 'text-slate-600');
                }, 2000);
            });
        });
    </script>

    <!-- Fade In Animation styles -->
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body>
</html>
