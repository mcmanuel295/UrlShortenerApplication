<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <!-- Custom CSS Link -->
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <div class="container">
        
        <!-- Header -->
        <h1 class="header">🔗 URL Shortener</h1>

        <!-- Input Section -->
        <form id="shortenerForm" class="form">
            <div class="form-group">
                <label for="urlInput" class="label">Enter URL to shorten:</label>
                <input 
                    type="url" 
                    id="urlInput" 
                    required
                    placeholder="https://www.github.com" 
                    class="input-field"
                />
            </div>
            <button 
                type="submit" 
                class="btn-submit"
            >
                Shorten URL
            </button>
        </form>

        <!-- Result Section -->
        <div id="resultSection" class="result-section hidden animate-fade-in">
            
            <!-- Success Message -->
            <div class="success-message">
                <span class="success-icon">✓</span>
                <span>Short URL Created!</span>
            </div>

            <!-- Original URL Field -->
            <div class="form-group">
                <label for="originalUrlTextbox" class="label">Original URL:</label>
                <input 
                    type="text" 
                    id="originalUrlTextbox" 
                    readonly
                    class="input-field readonly-field"
                />
            </div>

            <!-- Short URL Field -->
            <div class="form-group">
                <label for="shortUrlTextbox" class="label">Short URL:</label>
                <div class="input-with-button">
                    <input 
                        type="text" 
                        id="shortUrlTextbox" 
                        readonly
                        class="input-field readonly-field short-url-field"
                    />
                    <button 
                        id="copyButton"
                        type="button"
                        class="btn-copy"
                    >
                        Copy
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- Custom Script Link -->
    <script src="index.js"></script>
</body>
</html>
